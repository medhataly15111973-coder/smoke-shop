<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تعديل الأسعار السريع - Smoke Shop</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0 0 96px 0; background: #090d16; color: #f8fafc; }
  header { position: sticky; top: 0; z-index: 30; background: #111827; border-bottom: 1px solid #1f2937; padding: 12px 16px; }
  .header-inner { max-width: 540px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .brand h1 { margin: 0; font-size: 15px; color: #fbbf24; }
  .brand p { margin: 2px 0 0; font-size: 11px; color: #94a3b8; }
  .badge { font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 999px; background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); white-space: nowrap; }
  .badge.warn { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
  main { max-width: 540px; margin: 14px auto 0; padding: 0 12px; }
  .card { background: #111827; border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 16px; padding: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .card-top h2 { margin: 0; font-size: 15px; color: #fbbf24; }
  .card-top p { margin: 4px 0 0; font-size: 11px; color: #94a3b8; line-height: 1.5; }
  .mod-badge { font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 999px; background: #1e293b; color: #94a3b8; white-space: nowrap; }
  .mod-badge.active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.45); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  select, input[type="text"] { width: 100%; background: #090d16; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; padding: 9px 10px; font-size: 12px; outline: none; }
  select:focus, input[type="text"]:focus, input[type="number"]:focus { border-color: #f59e0b; }
  .list { display: flex; flex-direction: column; gap: 7px; max-height: 58vh; overflow-y: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 10px; }
  .row.modified { background: rgba(6, 78, 59, 0.35); border-color: rgba(16, 185, 129, 0.55); }
  .item-info { min-width: 0; flex: 1; }
  .item-name { margin: 0; font-size: 13px; font-weight: bold; color: #ffffff; }
  .item-sub { margin: 3px 0 0; font-size: 11px; color: #64748b; }
  .price-box { display: flex; align-items: center; gap: 6px; }
  .price-input { width: 84px; background: #111827; color: #fcd34d; border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; font-size: 13px; font-weight: bold; text-align: center; outline: none; }
  .currency { font-size: 11px; color: #94a3b8; }
  .footer-bar { margin-top: 12px; padding-top: 8px; border-top: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; }
  .link-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px 0; font-size: 11px; }
  .link-btn.reset:hover { color: #f87171; }
  .bottom-actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #111827; border-top: 1px solid #1f2937; padding: 10px 12px; }
  .bottom-inner { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
  .btn-copy { background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-save { background: #059669; color: #ffffff; border: none; border-radius: 12px; padding: 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-save:hover { background: #10b981; }
  .btn-save:disabled { opacity: 0.65; cursor: not-allowed; }
  .empty { text-align: center; padding: 28px 12px; color: #64748b; font-size: 12px; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">🏷️</div>
      <div>
        <h1>SMOKE SHOP</h1>
        <p>تعديل الأسعار والمزامنة الفورية</p>
      </div>
    </div>
    <span id="itemsCountBadge" class="badge">جاهز</span>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-top">
      <div>
        <h2>📱 التعديل السريع للأسعار</h2>
        <p>اختر القسم أو ابحث بالاسم، عدّل السعر مباشرة، ثم اضغط حفظ ومزامنة لتحديث المتجر فوراً.</p>
      </div>
      <span id="mobileModifiedBadge" class="mod-badge">0 معدّل</span>
    </div>

    <div class="filters">
      <select id="mobileQuickCatSelect">
        <option value="all">كل الأقسام</option>
      </select>
      <input type="text" id="mobileQuickSearch" placeholder="بحث باسم الصنف...">
    </div>

    <div id="mobileQuickPriceList" class="list"></div>

    <div class="footer-bar">
      <span style="color:#94a3b8;">🔄 مزامنة تلقائية مع Firestore و localStorage</span>
      <button type="button" id="resetBtn" class="link-btn reset">
        ↺ تراجع عن التعديلات
      </button>
    </div>
  </section>
</main>

<div class="bottom-actions">
  <div class="bottom-inner">
    <button type="button" id="copyBtn" class="btn-copy">📋 نسخ التعديلات</button>
    <button type="button" id="saveBtn" class="btn-save">💾 حفظ ومزامنة</button>
  </div>
</div>

<script>
(function () {
  var firebaseConfig = {
    apiKey: "AIzaSyDAxEZQCBYcTAFDtaGViL56ppV_Iuxk3fQ",
    authDomain: "smokeshop-40107.firebaseapp.com",
    projectId: "smokeshop-40107",
    storageBucket: "smokeshop-40107.firebasestorage.app",
    messagingSenderId: "374658562456",
    appId: "1:374658562456:web:f88582e223579683a0d3ed",
    measurementId: "G-R420RTFBFV"
  };

  var db = null;
  try {
    if (window.firebase) {
      var fbApp = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
      db = fbApp.firestore();
    }
  } catch (e) {}

  var CATEGORIES = [
    { id: "all", n: "كل الأقسام" },
    { id: "local", n: "سجائر محلي" },
    { id: "for", n: "سجائر أجنبي" },
    { id: "oth", n: "متنوع وبحري" },
    { id: "acc", n: "ولاعات وبفرة" },
    { id: "mol", n: "تبغ وتوباكو" }
  ];

  var DEFAULT_PRODUCTS = [
    { id: 1, name: "كيلوباترا", c: "local", p: 485 },
    { id: 2, name: "بوكس", c: "local", p: 485 },
    { id: 3, name: "سوبر", c: "local", p: 495 },
    { id: 4, name: "ال ام احمر", c: "for", p: 825 },
    { id: 5, name: "ال ام ازرق", c: "for", p: 825 },
    { id: 6, name: "ال ام ابيض", c: "for", p: 810 },
    { id: 7, name: "مارلبورو", c: "for", p: 1020 },
    { id: 8, name: "ميريت", c: "for", p: 1115 },
    { id: 9, name: "مارلبورو كرافتد", c: "for", p: 785 },
    { id: 10, name: "ونستون", c: "for", p: 705 },
    { id: 11, name: "تارجت شركه", c: "for", p: 485 },
    { id: 12, name: "تايم شركه", c: "for", p: 570 },
    { id: 13, name: "دوف ايفولف", c: "for", p: 610 },
    { id: 14, name: "جولد كوست", c: "oth", p: 480 },
    { id: 15, name: "دوف", c: "for", p: 1020 },
    { id: 16, name: "كنتاكى", c: "oth", p: 220 },
    { id: 17, name: "ال ان", c: "oth", p: 220 },
    { id: 18, name: "ريد قديم", c: "oth", p: 375 },
    { id: 19, name: "ريد جديد", c: "oth", p: 315 },
    { id: 20, name: "كاريلا احمر", c: "oth", p: 370 },
    { id: 21, name: "كاريلا ازرق", c: "oth", p: 370 },
    { id: 22, name: "كابتن سكاى", c: "oth", p: 250 },
    { id: 23, name: "بن ازرق", c: "oth", p: 250 },
    { id: 24, name: "تايم بحرى", c: "oth", p: 305 },
    { id: 25, name: "تايم جديد", c: "oth", p: 235 },
    { id: 26, name: "تارجت بحر", c: "oth", p: 255 },
    { id: 27, name: "كابتن زيرو فايف", c: "oth", p: 285 },
    { id: 28, name: "كابتن جولد سليم", c: "oth", p: 290 },
    { id: 29, name: "كابتن كومباكت جولد", c: "oth", p: 330 },
    { id: 30, name: "اتش بى", c: "oth", p: 255 },
    { id: 31, name: "ولاعه عاده", c: "acc", p: 200 },
    { id: 32, name: "ولاعه سخان", c: "acc", p: 250 },
    { id: 33, name: "بفره جاهزه", c: "acc", p: 235 },
    { id: 34, name: "سلوووم", c: "mol", p: 2400 },
    { id: 35, name: "دفراوى ١٠", c: "mol", p: 1400 },
    { id: 36, name: "دفراوى ٢0", c: "mol", p: 2200 },
    { id: 37, name: "برج ٣0", c: "mol", p: 700 },
    { id: 38, name: "برج ٤0", c: "mol", p: 750 },
    { id: 39, name: "برج ٥0", c: "mol", p: 950 }
  ];

  // إضافة 5 جنيه لسجائر محلي و20 جنيه لباقي الأقسام عند الإرسال للتطبيق
  function getCategoryMarkup(catId) {
    return String(catId) === "local" ? 5 : 20;
  }

  // السعر الأساسي المعروض داخل صفحة التعديل بدون الزيادة
  function getDisplayBasePrice(prod) {
    var rawP = Math.round(Number(prod && prod.p) || 0);
    if (prod && prod._updaterBaseP !== undefined && !isNaN(Number(prod._updaterBaseP))) {
      return Math.round(Number(prod._updaterBaseP));
    }
    return rawP;
  }

  function loadInitialProducts() {
    try {
      var raw = localStorage.getItem("sp_p");
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length >= DEFAULT_PRODUCTS.length) {
          return parsed;
        }
      }
    } catch (e) {}
    return DEFAULT_PRODUCTS.slice();
  }

  function saveLocalProducts(list) {
    try { localStorage.setItem("sp_p", JSON.stringify(list)); } catch (e) {}
  }

  var PRODUCTS = loadInitialProducts();
  var pendingPrices = {};
  var isSaving = false;

  var catSelect = document.getElementById("mobileQuickCatSelect");
  var searchInput = document.getElementById("mobileQuickSearch");
  var listContainer = document.getElementById("mobileQuickPriceList");
  var modBadge = document.getElementById("mobileModifiedBadge");
  var itemsBadge = document.getElementById("itemsCountBadge");
  var saveBtn = document.getElementById("saveBtn");
  var copyBtn = document.getElementById("copyBtn");

  function setStatusBadge(text, isWarn) {
    if (!itemsBadge) return;
    itemsBadge.textContent = text;
    itemsBadge.className = isWarn ? "badge warn" : "badge";
  }

  function buildCategoryOptions() {
    var prev = catSelect.value || "all";
    var html = "";
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      var count = cat.id === "all"
        ? PRODUCTS.length
        : PRODUCTS.filter(function (p) { return String(p.c) === String(cat.id); }).length;
      html += '<option value="' + cat.id + '">' + cat.n + " (" + count + ")</option>";
    }
    catSelect.innerHTML = html;
    if (CATEGORIES.some(function (c) { return c.id === prev; })) {
      catSelect.value = prev;
    } else {
      catSelect.value = "all";
    }
  }

  function getModifiedList() {
    var result = [];
    for (var i = 0; i < PRODUCTS.length; i++) {
      var prod = PRODUCTS[i];
      var key = String(prod.id);
      if (pendingPrices[key] !== undefined) {
        var shownBaseP = getDisplayBasePrice(prod);
        var enteredP = Math.round(Number(pendingPrices[key]));
        if (!isNaN(enteredP) && enteredP > 0 && enteredP !== shownBaseP) {
          var finalP = enteredP + getCategoryMarkup(prod.c);
          result.push({
            id: prod.id,
            name: prod.name,
            c: prod.c,
            basePrice: enteredP,
            finalPrice: finalP
          });
        }
      }
    }
    return result;
  }

  function updateBadge() {
    var count = getModifiedList().length;
    modBadge.textContent = count + " معدّل";
    modBadge.className = count > 0 ? "mod-badge active" : "mod-badge";
  }

  function handlePriceChange(prodId, rawVal) {
    var key = String(prodId);
    var prod = PRODUCTS.find(function (p) { return String(p.id) === key; });
    if (!prod) return;

    var cleaned = String(rawVal || "").replace(/[٠-٩]/g, function (d) {
      return "0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)];
    }).trim();

    var shownBaseP = getDisplayBasePrice(prod);
    var num = parseInt(cleaned, 10);

    if (cleaned === "" || isNaN(num) || num === shownBaseP) {
      delete pendingPrices[key];
    } else {
      pendingPrices[key] = num;
    }

    var rowEl = document.getElementById("row-" + key);
    var isMod = pendingPrices[key] !== undefined && pendingPrices[key] > 0 && pendingPrices[key] !== shownBaseP;
    if (rowEl) rowEl.className = isMod ? "row modified" : "row";

    updateBadge();
  }

  function renderList() {
    var selectedCat = catSelect.value || "all";
    var query = String(searchInput.value || "").trim().toLowerCase();

    var rowsHtml = "";
    for (var i = 0; i < PRODUCTS.length; i++) {
      var p = PRODUCTS[i];
      var matchCat = (selectedCat === "all" || String(p.c) === String(selectedCat));
      var matchQuery = (!query || String(p.name || "").toLowerCase().indexOf(query) !== -1);
      if (!matchCat || !matchQuery) continue;

      var key = String(p.id);
      var shownBaseP = getDisplayBasePrice(p);
      var hasPending = pendingPrices[key] !== undefined && pendingPrices[key] > 0 && pendingPrices[key] !== shownBaseP;
      var shownVal = hasPending ? pendingPrices[key] : shownBaseP;

      rowsHtml +=
        '<div id="row-' + key + '" class="' + (hasPending ? "row modified" : "row") + '">' +
          '<div class="item-info">' +
            '<p class="item-name">' + p.name + '</p>' +
            '<p class="item-sub">الحالي: ' + shownBaseP + ' ج.م</p>' +
          '</div>' +
          '<div class="price-box">' +
            '<input type="number" inputmode="numeric" class="price-input" data-id="' + key + '" value="' + shownVal + '">' +
            '<span class="currency">ج.م</span>' +
          '</div>' +
        '</div>';
    }

    if (!rowsHtml) {
      listContainer.innerHTML = '<div class="empty">لا توجد أصناف مطابقة للبحث</div>';
      return;
    }

    listContainer.innerHTML = rowsHtml;

    var inputs = listContainer.querySelectorAll(".price-input");
    for (var k = 0; k < inputs.length; k++) {
      inputs[k].addEventListener("input", function () {
        handlePriceChange(this.getAttribute("data-id"), this.value);
      });
      inputs[k].addEventListener("focus", function () {
        this.select();
      });
    }
  }

  async function saveChanges() {
    if (isSaving) return;
    var mods = getModifiedList();
    if (!mods.length) {
      setStatusBadge("لا يوجد تعديل", true);
      setTimeout(function () { setStatusBadge(PRODUCTS.length + " صنف", false); }, 1500);
      return;
    }

    isSaving = true;
    if (saveBtn) saveBtn.disabled = true;
    setStatusBadge("جاري الحفظ...", true);

    var updatedItems = [];
    for (var i = 0; i < mods.length; i++) {
      var m = mods[i];
      var found = PRODUCTS.find(function (p) { return String(p.id) === String(m.id); });
      if (found) {
        found._updaterBaseP = m.basePrice;
        found.p = m.finalPrice;
        updatedItems.push(found);
      }
    }

    pendingPrices = {};
    saveLocalProducts(PRODUCTS);

    var synced = false;
    if (db && updatedItems.length > 0) {
      try {
        var batch = db.batch();
        for (var j = 0; j < updatedItems.length; j++) {
          var item = updatedItems[j];
          var ref = db.collection("products").doc(String(item.id));
          batch.set(ref, {
            id: item.id,
            name: item.name,
            c: item.c,
            p: item.p,
            _updaterBaseP: item._updaterBaseP
          }, { merge: true });
        }
        await batch.commit();
        synced = true;
      } catch (err) {
        synced = false;
      }
    }

    buildCategoryOptions();
    renderList();
    updateBadge();
    setStatusBadge(synced ? ("تم الحفظ ✅") : ("محلي فقط ⚠️"), !synced);

    isSaving = false;
    if (saveBtn) saveBtn.disabled = false;
  }

  function startAutoSync() {
    setStatusBadge(PRODUCTS.length + " صنف", false);
    if (!db) return;
    try {
      db.collection("products").onSnapshot(function (snap) {
        if (snap.empty || isSaving) return;
        var cloudProds = [];
        snap.forEach(function (doc) {
          if (doc.id.indexOf("_") !== 0) {
            var d = doc.data();
            if (d && d.name && d.p !== undefined) {
              var localMatch = PRODUCTS.find(function (lp) { return String(lp.id) === String(doc.id); });
              var baseVal = (d._updaterBaseP !== undefined && !isNaN(Number(d._updaterBaseP)))
                ? Number(d._updaterBaseP)
                : (localMatch && localMatch._updaterBaseP !== undefined && !isNaN(Number(localMatch._updaterBaseP))
                    ? Number(localMatch._updaterBaseP)
                    : Number(d.p));

              cloudProds.push({
                id: isNaN(Number(doc.id)) ? doc.id : Number(doc.id),
                name: d.name,
                c: d.c || "oth",
                p: Number(d.p),
                _updaterBaseP: baseVal
              });
            }
          }
        });
        if (cloudProds.length >= DEFAULT_PRODUCTS.length) {
          cloudProds.sort(function (a, b) { return (Number(a.id) || 0) - (Number(b.id) || 0); });
          PRODUCTS = cloudProds;
          saveLocalProducts(PRODUCTS);
          buildCategoryOptions();
          renderList();
          updateBadge();
          setStatusBadge(PRODUCTS.length + " صنف ✅", false);
        }
      });
    } catch (e) {}
  }

  function buildCopyText() {
    var mods = getModifiedList();
    var target = mods.length ? mods.map(function (m) {
      return { name: m.name, price: m.finalPrice };
    }) : PRODUCTS.map(function (p) {
      return { name: p.name, price: p.p };
    });
    var lines = ["تحديث أسعار Smoke Shop"];
    for (var i = 0; i < target.length; i++) {
      lines.push(target[i].name + ": " + target[i].price + " ج.م");
    }
    return lines.join("\n");
  }

  saveBtn.addEventListener("click", saveChanges);

  copyBtn.addEventListener("click", function () {
    var text = buildCopyText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setStatusBadge("تم النسخ 📋", false);
        setTimeout(function () { setStatusBadge(PRODUCTS.length + " صنف", false); }, 1500);
      }, function () {});
    }
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    pendingPrices = {};
    renderList();
    updateBadge();
  });

  catSelect.addEventListener("change", renderList);
  searchInput.addEventListener("input", renderList);

  buildCategoryOptions();
  renderList();
  updateBadge();
  startAutoSync();
})();
</script>
</body>
</html>
