let db = null;
let categories = [...DEFAULT_CATEGORIES];
let products = FALLBACK_PRODUCTS.map(x => ({ ...x }));
let adminPhone = '01221143854';
let mobilePendingPrices = {};

try {
  const savedCats = JSON.parse(localStorage.getItem('sp_price_editor_cats') || 'null');
  if (Array.isArray(savedCats) && savedCats.length > 0) categories = savedCats;

  const savedProds = JSON.parse(localStorage.getItem('sp_price_editor_prods') || 'null');
  if (Array.isArray(savedProds) && savedProds.length > 0) products = savedProds;

  const savedPhone = localStorage.getItem('sp_price_editor_phone');
  if (savedPhone) adminPhone = savedPhone;
} catch (e) {}

function initFirebaseSafe() {
  if (typeof firebase === 'undefined') return null;
  try {
    if (!firebase.apps || firebase.apps.length === 0) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.firestore();
    return db;
  } catch (e) {
    console.warn("Firebase init notice:", e);
    return null;
  }
}

function setCloudStatus(text, type) {
  const el = document.getElementById('cloudSyncStatus');
  if (!el) return;
  el.innerText = text;
  if (type === 'ok') {
    el.className = "text-[10px] px-2 py-1 rounded-lg font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
  } else if (type === 'warn') {
    el.className = "text-[10px] px-2 py-1 rounded-lg font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
  } else {
    el.className = "text-[10px] px-2 py-1 rounded-lg font-bold bg-slate-800 text-slate-400";
  }
}

function extractCategoriesFromDoc(data) {
  if (!data || typeof data !== 'object') return null;
  if (Array.isArray(data.list) && data.list.length > 0) return data.list;
  if (Array.isArray(data.categories) && data.categories.length > 0) return data.categories;
  for (const k of Object.keys(data)) {
    if (Array.isArray(data[k]) && data[k].length > 0 && typeof data[k][0] === 'object' && data[k][0].id) {
      return data[k];
    }
  }
  return null;
}

function normalizeProductDoc(docId, data) {
  if (!data || typeof data !== 'object') return null;
  const name = data.name || data.title || data.n || data.productName || '';
  const rawPrice = data.p !== undefined ? data.p : (data.price !== undefined ? data.price : (data.cost !== undefined ? data.cost : null));
  const numPrice = Number(rawPrice);
  if (!name || rawPrice === null || isNaN(numPrice)) return null;

  return {
    id: data.id !== undefined ? data.id : docId,
    name: String(name).trim(),
    c: String(data.c || data.cat || data.category || 'oth').trim(),
    p: numPrice
  };
}

function applySnapshotDocs(snapshot) {
  if (!snapshot || snapshot.empty) {
    setCloudStatus(`${products.length} صنف`, 'warn');
    return;
  }

  const loadedProds = [];
  let foundCloudCats = null;

  snapshot.forEach(doc => {
    const docId = String(doc.id);
    const data = doc.data() || {};

    if (docId === "_categories_config_" || docId === "categories_config" || docId === "categories") {
      const parsed = extractCategoriesFromDoc(data);
      if (parsed) foundCloudCats = parsed;
    } else if (!docId.startsWith("_")) {
      const item = normalizeProductDoc(docId, data);
      if (item) loadedProds.push(item);
    }
  });

  if (foundCloudCats) {
    categories = foundCloudCats;
    try { localStorage.setItem('sp_price_editor_cats', JSON.stringify(categories)); } catch (e) {}
  }

  if (loadedProds.length > 0) {
    products = loadedProds.sort((a, b) => {
      const na = Number(a.id);
      const nb = Number(b.id);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return String(a.name).localeCompare(String(b.name), 'ar');
    });
    try { localStorage.setItem('sp_price_editor_prods', JSON.stringify(products)); } catch (e) {}
  }

  populateMobileQuickCategories();
  renderMobileQuickPriceList();
  updateMobileModifiedBadge();
  setCloudStatus(`${products.length} صنف ☁️`, 'ok');
}

async function refreshFromCloud() {
  const firestore = db || initFirebaseSafe();
  if (!firestore) {
    setCloudStatus(`${products.length} صنف`, 'warn');
    return;
  }
  setCloudStatus('⏳ تحديث...', 'idle');
  try {
    const snapshot = await firestore.collection("products").get();
    applySnapshotDocs(snapshot);
  } catch (e) {
    console.warn("Firestore refresh error:", e);
    setCloudStatus(`${products.length} صنف`, 'warn');
  }
}

function subscribeToCloudProducts() {
  const firestore = db || initFirebaseSafe();
  if (!firestore) {
    setCloudStatus(`${products.length} صنف`, 'warn');
    return;
  }
  try {
    firestore.collection("products").onSnapshot(
      (snapshot) => applySnapshotDocs(snapshot),
      (err) => {
        console.warn("Firestore snapshot notice:", err);
        setCloudStatus(`${products.length} صنف`, 'warn');
      }
    );
  } catch (e) {
    setCloudStatus(`${products.length} صنف`, 'warn');
  }
}

function populateMobileQuickCategories() {
  const select = document.getElementById('mobileQuickCatSelect');
  if (!select) return;
  const currentVal = select.value || 'all';

  const mergedCats = [];
  const seenIds = new Set();

  const addCat = (c) => {
    if (!c || !c.id) return;
    const idStr = String(c.id);
    if (seenIds.has(idStr)) return;
    seenIds.add(idStr);
    mergedCats.push({ id: idStr, n: c.n || c.name || idStr });
  };

  addCat({ id: 'all', n: 'كل الأقسام' });
  categories.forEach(addCat);
  DEFAULT_CATEGORIES.forEach(addCat);

  const labelMap = {
    local: 'سجائر محلي',
    for: 'سجائر أجنبي',
    oth: 'متنوع وبحري',
    acc: 'ولاعات وبفرة',
    mol: 'تبغ وتوباكو'
  };

  products.forEach(p => {
    if (p.c) {
      addCat({ id: String(p.c), n: labelMap[p.c] || String(p.c) });
    }
  });

  select.innerHTML = mergedCats.map(c => {
    const count = c.id === 'all' ? products.length : products.filter(p => String(p.c) === c.id).length;
    const prefix = c.id === 'all' ? '✨ ' : '';
    return `<option value="${c.id}">${prefix}${c.n} (${count})</option>`;
  }).join('');

  select.value = seenIds.has(String(currentVal)) ? String(currentVal) : 'all';
}

function getMobileModifiedEntries() {
  const entries = [];
  Object.entries(mobilePendingPrices).forEach(([pid, newVal]) => {
    const prod = products.find(p => String(p.id) === String(pid));
    if (!prod) return;
    const oldPrice = Math.round(Number(prod.p) || 0);
    const parsedNew = Math.round(Number(newVal));
    if (!isNaN(parsedNew) && parsedNew > 0 && parsedNew !== oldPrice) {
      entries.push({
        id: prod.id,
        name: prod.name,
        oldPrice,
        newPrice: parsedNew,
        diff: parsedNew - oldPrice
      });
    }
  });
  return entries;
}

function updateMobileModifiedBadge() {
  const badge = document.getElementById('mobileModifiedBadge');
  if (!badge) return;
  const count = getMobileModifiedEntries().length;
  if (count > 0) {
    badge.innerText = `${count} معدّل ✨`;
    badge.className = "shrink-0 text-[10px] px-2.5 py-1 rounded-full font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
  } else {
    badge.innerText = "0 معدّل";
    badge.className = "shrink-0 text-[10px] px-2.5 py-1 rounded-full font-black bg-slate-800 text-slate-400";
  }
}

function onMobileQuickPriceInput(prodId, rawVal) {
  const pid = String(prodId);
  const prod = products.find(p => String(p.id) === pid);
  if (!prod) return;

  const cleanStr = String(rawVal || '').replace(/[٠-٩]/g, d => '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]).trim();
  const oldPrice = Math.round(Number(prod.p) || 0);

  if (cleanStr === '') {
    delete mobilePendingPrices[pid];
  } else {
    const num = Math.round(parseFloat(cleanStr));
    if (!isNaN(num) && num !== oldPrice) {
      mobilePendingPrices[pid] = num;
    } else {
      delete mobilePendingPrices[pid];
    }
  }

  const rowEl = document.getElementById(`mq-row-${pid}`);
  const diffEl = document.getElementById(`mq-diff-${pid}`);
  const isModified = mobilePendingPrices[pid] !== undefined && mobilePendingPrices[pid] > 0;

  if (rowEl) {
    rowEl.className = isModified
      ? "flex items-center justify-between gap-2 bg-emerald-950/35 border border-emerald-500/50 p-2.5 rounded-xl text-xs transition"
      : "flex items-center justify-between gap-2 bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs transition";
  }

  if (diffEl) {
    if (isModified) {
      const diff = mobilePendingPrices[pid] - oldPrice;
      const sign = diff > 0 ? '+' : '';
      diffEl.innerText = `${oldPrice} ← (${sign}${diff})`;
      diffEl.className = diff > 0
        ? "text-[10px] font-bold text-amber-400"
        : "text-[10px] font-bold text-emerald-400";
    } else {
      diffEl.innerText = `الحالي: ${oldPrice} ج.م`;
      diffEl.className = "text-[10px] text-slate-500";
    }
  }

  updateMobileModifiedBadge();
}

function renderMobileQuickPriceList() {
  const container = document.getElementById('mobileQuickPriceList');
  if (!container) return;

  const catId = document.getElementById('mobileQuickCatSelect')?.value || 'all';
  const query = (document.getElementById('mobileQuickSearch')?.value || '').trim().toLowerCase();

  const list = products.filter(p => {
    const matchCat = (catId === 'all' || String(p.c) === String(catId));
    const matchName = !query || (p.name && p.name.toLowerCase().includes(query));
    return matchCat && matchName;
  });

  if (!list.length) {
    container.innerHTML = '<div class="text-center py-8 text-slate-500 text-xs bg-slate-950 rounded-xl border border-slate-800">لا توجد أصناف مطابقة للبحث 🔍</div>';
    return;
  }

  container.innerHTML = list.map(p => {
    const pid = String(p.id);
    const oldPrice = Math.round(Number(p.p) || 0);
    const pendingVal = mobilePendingPrices[pid];
    const isModified = pendingVal !== undefined && pendingVal > 0 && pendingVal !== oldPrice;
    const inputVal = pendingVal !== undefined ? pendingVal : oldPrice;
    const diff = isModified ? (pendingVal - oldPrice) : 0;

    return `
      <div id="mq-row-${pid}" class="flex items-center justify-between gap-2 ${isModified ? 'bg-emerald-950/35 border-emerald-500/50' : 'bg-slate-950 border-slate-800'} border p-2.5 rounded-xl text-xs transition">
        <div class="min-w-0 flex-1">
          <p class="font-bold text-white truncate">${p.name}</p>
          <p id="mq-diff-${pid}" class="${isModified ? (diff > 0 ? 'text-[10px] font-bold text-amber-400' : 'text-[10px] font-bold text-emerald-400') : 'text-[10px] text-slate-500'}">
            ${isModified ? `${oldPrice} ← (${diff > 0 ? '+' : ''}${diff})` : `الحالي: ${oldPrice} ج.م`}
          </p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <input
            type="number"
            inputmode="numeric"
            pattern="[0-9]*"
            value="${inputVal}"
            onfocus="this.select()"
            oninput="onMobileQuickPriceInput('${pid}', this.value)"
            class="w-20 bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg py-1.5 px-2 text-center font-black text-amber-300 text-xs focus:outline-none"
          >
          <span class="text-[10px] text-slate-400">ج.م</span>
        </div>
      </div>
    `;
  }).join('');
}

function buildWhatsappMessageText() {
  const modified = getMobileModifiedEntries();
  if (!modified.length) return '';
  const lines = modified.map(m => `${m.name} ${m.newPrice}`);
  return `📋 *تحديث أسعار - Smoke Shop*
` + lines.join('
');
}

function sendMobileQuickChangesWhatsapp() {
  const msg = buildWhatsappMessageText();
  if (!msg) {
    alert('لا توجد تعديلات حالية لإرسالها! عدّل سعراً واحداً على الأقل أولاً.');
    return;
  }

  let dest = (adminPhone || '01221143854').replace(/\D/g, '');
  if (dest.startsWith('01')) dest = '2' + dest;

  window.open(`https://wa.me/${dest}?text=${encodeURIComponent(msg)}`, '_blank');
}

function copyModifiedText() {
  const msg = buildWhatsappMessageText();
  if (!msg) {
    alert('لا توجد تعديلات حالية لنسخها! عدّل سعراً واحداً على الأقل أولاً.');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(() => {
      alert('✅ تم نسخ نص التعديلات بنجاح! يمكنك لصقه في واتساب.');
    }).catch(() => {
      prompt('انسخ النص التالي:', msg);
    });
  } else {
    prompt('انسخ النص التالي:', msg);
  }
}

function resetMobileQuickEdits() {
  if (Object.keys(mobilePendingPrices).length === 0) return;
  if (!confirm('هل تريد التراجع عن جميع التعديلات التي أدخلتها؟')) return;
  mobilePendingPrices = {};
  renderMobileQuickPriceList();
  updateMobileModifiedBadge();
}

function openRecipientSettings() {
  const newPhone = prompt('أدخل رقم واتساب الإدارة الذي ستُرسل إليه التعديلات:', adminPhone);
  if (newPhone && newPhone.trim()) {
    adminPhone = newPhone.trim();
    try { localStorage.setItem('sp_price_editor_phone', adminPhone); } catch (e) {}
    document.getElementById('targetPhonePreview').innerText = adminPhone;
  }
}

(function boot() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('phone')) {
    adminPhone = params.get('phone').trim();
    try { localStorage.setItem('sp_price_editor_phone', adminPhone); } catch (e) {}
  }
  const phoneEl = document.getElementById('targetPhonePreview');
  if (phoneEl) phoneEl.innerText = adminPhone;

  setCloudStatus(`${products.length} صنف`, 'warn');
  populateMobileQuickCategories();
  renderMobileQuickPriceList();
  updateMobileModifiedBadge();
  subscribeToCloudProducts();
})();
</script>
</body>
</html>
