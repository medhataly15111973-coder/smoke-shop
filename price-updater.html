<style>

  font-family: 'Cairo', sans-serif;

  background: #090d16;

<body class="bg-[#090d16] text-slate-100 min-h-screen">

<header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30 shadow-md">
  <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl overflow-hidden border border-amber-500/40 bg-slate-800 flex items-center justify-center p-0.5 shrink-0">

      </div>

        <h1 class="font-black text-sm text-amber-400 leading-none truncate">SMOKE SHOP</h1>

</header>

<main class="max-w-md mx-auto p-3 space-y-3">

  <section class="bg-slate-900 border border-amber-500/35 rounded-2xl p-3.5 space-y-3 shadow-lg">
    <div class="flex justify-between items-start gap-2">
      <div>
        <h2 class="font-black text-sm text-amber-400 flex items-center gap-1.5">
          <span>📱 التعديل السريع للأسعار</span>
        </h2>
        <p class="text-[10px] text-slate-400 mt-0.5 leading-relaxed">
          اختر القسم أو ابحث بالاسم، عدّل السعر مباشرة، ثم احفظ في المتجر أو أرسل التعديلات على واتساب.
        </p>
      </div>
      <span id="mobileModifiedBadge" class="shrink-0 text-[10px] px-2.5 py-1 rounded-full font-black bg-slate-800 text-slate-400 border border-slate-700">
        0 معدّل
      </span>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <select id="mobileQuickCatSelect" class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl p-2 text-xs focus:outline-none focus:border-amber-500">
        <option value="all">✨ كل الأقسام</option>
      </select>
      <input type="text" id="mobileQuickSearch" placeholder="🔍 ابحث باسم الصنف..." class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl p-2 text-xs focus:outline-none focus:border-amber-500">
    </div>

    <div id="mobileQuickPriceList" class="space-y-1.5 max-h-[56vh] overflow-y-auto pr-0.5"></div>

    <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-2 text-[11px]">
      <button type="button" id="editPhoneBtn" class="text-slate-400 hover:text-amber-300 transition text-right">
        ⚙️ واتساب الإدارة: <strong id="shopPhoneLabel" class="text-amber-300 font-mono">01221143854</strong>
      </button>
      <button type="button" id="resetEditsBtn" class="text-slate-400 hover:text-red-400 font-bold transition">
        ↺ تراجع
      </button>
    </div>
  </section>

</main>

<div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-2.5 z-30">
  <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
    <button type="button" id="saveCloudBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 px-2 rounded-xl text-[11px] flex items-center justify-center gap-1 shadow transition active:scale-95">
      <span>💾 حفظ</span>
    </button>
    <button type="button" id="copyChangesBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-black py-2.5 px-2 rounded-xl text-[11px] flex items-center justify-center gap-1 transition active:scale-95">
      <span>📋 نسخ</span>
    </button>
    <button type="button" id="sendWhatsappBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 px-2 rounded-xl text-[11px] flex items-center justify-center gap-1 shadow transition active:scale-95">
      <span>📲 واتساب</span>
    </button>
  </div>
</div>

<script>
(function() {
  const firebaseConfig = {

  const DEFAULT_CATEGORIES = [

  const INITIAL_PRODUCTS = [
    { id: 1, name: "كيلوباترا", c: "local", p: 485, u: "خرطوشة" },
    { id: 2, name: "بوكس", c: "local", p: 485, u: "خرطوشة" },
    { id: 3, name: "سوبر", c: "local", p: 495, u: "خرطوشة" },

    { id: 6, name: "ال ام ابيض", c: "for", p: 810, u: "خرطوشة" },
    { id: 7, name: "مارلبورو", c: "for", p: 1020, u: "خرطوشة" },
    { id: 8, name: "ميريت", c: "for", p: 1115, u: "خرطوشة" },
    { id: 9, name: "مارلبورو كرافتد", c: "for", p: 785, u: "خرطوشة" },
    { id: 10, name: "ونستون", c: "for", p: 705, u: "خرطوشة" },
    { id: 11, name: "تارجت شركه", c: "for", p: 485, u: "خرطوشة" },
    { id: 12, name: "تايم شركه", c: "for", p: 570, u: "خرطوشة" },
    { id: 13, name: "دوف ايفولف", c: "for", p: 610, u: "خرطوشة" },
    { id: 14, name: "جولد كوست", c: "oth", p: 480, u: "خرطوشة" },
    { id: 15, name: "دوف", c: "for", p: 1020, u: "خرطوشة" },
    { id: 16, name: "كنتاكى", c: "oth", p: 220, u: "خرطوشة" },
    { id: 17, name: "ال ان", c: "oth", p: 220, u: "خرطوشة" },
    { id: 18, name: "ريد قديم", c: "oth", p: 375, u: "خرطوشة" },
    { id: 19, name: "ريد جديد", c: "oth", p: 315, u: "خرطوشة" },
    { id: 20, name: "كاريلا احمر", c: "oth", p: 370, u: "خرطوشة" },
    { id: 21, name: "كاريلا ازرق", c: "oth", p: 370, u: "خرطوشة" },
    { id: 22, name: "كابتن سكاى", c: "oth", p: 250, u: "خرطوشة" },
    { id: 23, name: "بن ازرق", c: "oth", p: 250, u: "خرطوشة" },
    { id: 24, name: "تايم بحرى", c: "oth", p: 305, u: "خرطوشة" },
    { id: 25, name: "تايم جديد", c: "oth", p: 235, u: "خرطوشة" },
    { id: 26, name: "تارجت بحر", c: "oth", p: 255, u: "خرطوشة" },
    { id: 27, name: "كابتن زيرو فايف", c: "oth", p: 285, u: "خرطوشة" },
    { id: 28, name: "كابتن جولد سليم", c: "oth", p: 290, u: "خرطوشة" },
    { id: 29, name: "كابتن كومباكت جولد", c: "oth", p: 330, u: "خرطوشة" },
    { id: 30, name: "اتش بى", c: "oth", p: 255, u: "خرطوشة" },
    { id: 31, name: "ولاعه عاده", c: "acc", p: 200, u: "علبة" },
    { id: 32, name: "ولاعه سخان", c: "acc", p: 250, u: "علبة" },
    { id: 33, name: "بفره جاهزه", c: "acc", p: 235, u: "علبة" },
    { id: 34, name: "سلوووم", c: "mol", p: 2400, u: "كيلو" },
    { id: 35, name: "دفراوى ١٠", c: "mol", p: 1400, u: "كيلو" },
    { id: 36, name: "دفراوى ٢0", c: "mol", p: 2200, u: "كيلو" },
    { id: 37, name: "برج ٣0", c: "mol", p: 700, u: "كيلو" },
    { id: 38, name: "برج ٤0", c: "mol", p: 750, u: "كيلو" },
    { id: 39, name: "برج ٥0", c: "mol", p: 950, u: "كيلو" }
  ];

  function safeParseJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      return parsed ?? fallback;
    } catch (e) {
      return fallback;
    }
  }

  let categories = safeParseJSON('sp_cats', DEFAULT_CATEGORIES);
  if (!Array.isArray(categories) || !categories.length) categories = DEFAULT_CATEGORIES;

  let products = safeParseJSON('sp_p', INITIAL_PRODUCTS);
  if (!Array.isArray(products) || !products.length) products = INITIAL_PRODUCTS;

  let shopPhone = localStorage.getItem('sp_ph') || '01221143854';
  let mobilePendingPrices = {};

  const catSelectEl = document.getElementById('mobileQuickCatSelect');
  const searchInputEl = document.getElementById('mobileQuickSearch');
  const listContainerEl = document.getElementById('mobileQuickPriceList');
  const modBadgeEl = document.getElementById('mobileModifiedBadge');
  const phoneLabelEl = document.getElementById('shopPhoneLabel');
  const syncBadgeEl = document.getElementById('syncStatusBadge');

  function updatePhoneUI() {
    if (phoneLabelEl) phoneLabelEl.textContent = shopPhone;
  }

  function setSyncBadge(text, mode = 'ready') {
    if (!syncBadgeEl) return;
    syncBadgeEl.textContent = text;
    if (mode === 'ok') {
      syncBadgeEl.className = "text-[10px] px-2 py-1 rounded-full font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
    } else if (mode === 'warn') {
      syncBadgeEl.className = "text-[10px] px-2 py-1 rounded-full font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40";
    } else {
      syncBadgeEl.className = "text-[10px] px-2 py-1 rounded-full font-bold bg-slate-800 text-slate-300 border border-slate-700";
    }
  }

  function populateCategories() {
    if (!catSelectEl) return;
    const prevVal = catSelectEl.value || 'all';
    const hasAll = categories.some(c => c.id === 'all');
    const catsToRender = hasAll ? categories : [{ id: 'all', n: 'الكل', icon: '✨' }, ...categories];

    catSelectEl.innerHTML = catsToRender.map(c => {
      const count = c.id === 'all' ? products.length : products.filter(p => p.c === c.id).length;
      const prefix = c.icon ? `${c.icon} ` : '';
      return `<option value="${c.id}">${prefix}${c.n} (${count})</option>`;
    }).join('');

    if (catsToRender.some(c => c.id === prevVal)) {
      catSelectEl.value = prevVal;
    } else {
      catSelectEl.value = 'all';
    }
  }

  function getModifiedEntries() {
    const list = [];
    Object.entries(mobilePendingPrices).forEach(([pid, newVal]) => {
      const prod = products.find(p => String(p.id) === String(pid));
      if (!prod) return;
      const oldPrice = Math.round(Number(prod.p) || 0);
      const parsedNew = Math.round(Number(newVal));
      if (!isNaN(parsedNew) && parsedNew > 0 && parsedNew !== oldPrice) {
        list.push({
          id: prod.id,
          name: prod.name,
          oldPrice,
          newPrice: parsedNew,
          diff: parsedNew - oldPrice
        });
      }
    });
    return list;
  }

  function updateModifiedBadge() {
    if (!modBadgeEl) return;
    const count = getModifiedEntries().length;
    if (count > 0) {
      modBadgeEl.textContent = `${count} معدّل ✨`;
      modBadgeEl.className = "shrink-0 text-[10px] px-2.5 py-1 rounded-full font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
    } else {
      modBadgeEl.textContent = "0 معدّل";
      modBadgeEl.className = "shrink-0 text-[10px] px-2.5 py-1 rounded-full font-black bg-slate-800 text-slate-400 border border-slate-700";
    }
  }

  function handlePriceInput(prodId, rawVal) {
    const pid = String(prodId);
    const prod = products.find(p => String(p.id) === pid);
    if (!prod) return;

    const cleanStr = String(rawVal || '')
      .replace(/[٠-٩]/g, d => '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)])
      .trim();
    const oldPrice = Math.round(Number(prod.p) || 0);

    if (cleanStr === '') {
      delete mobilePendingPrices[pid];
    } else {
      const num = Math.round(parseFloat(cleanStr));
      if (!isNaN(num) && num !== oldPrice) {
        mobilePendingPrices[pid] = num;
      } else {
        delete mobilePendingPrices[pid];
      }
    }

    const rowEl = document.getElementById(`mq-row-${pid}`);
    const diffEl = document.getElementById(`mq-diff-${pid}`);
    const isModified = mobilePendingPrices[pid] !== undefined && mobilePendingPrices[pid] > 0;

    if (rowEl) {
      rowEl.className = isModified
        ? "flex items-center justify-between gap-2 bg-emerald-950/35 border border-emerald-500/50 p-2 rounded-xl text-xs transition"
        : "flex items-center justify-between gap-2 bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs transition";
    }

    if (diffEl) {
      if (isModified) {
        const diff = mobilePendingPrices[pid] - oldPrice;
        const sign = diff > 0 ? '+' : '';
        diffEl.textContent = `${oldPrice} ← (${sign}${diff})`;
        diffEl.className = diff > 0
          ? "text-[10px] font-bold text-amber-400"
          : "text-[10px] font-bold text-emerald-400";
      } else {
        diffEl.textContent = `الحالي: ${oldPrice} ج.م`;
        diffEl.className = "text-[10px] text-slate-500";
      }
    }

    updateModifiedBadge();
  }

  function renderList() {
    if (!listContainerEl) return;
    const catId = catSelectEl ? (catSelectEl.value || 'all') : 'all';
    const query = searchInputEl ? searchInputEl.value.trim().toLowerCase() : '';

    const filtered = products.filter(p => {
      const matchCat = (catId === 'all' || String(p.c) === String(catId));
      const matchName = !query || String(p.name || '').toLowerCase().includes(query);
      return matchCat && matchName;
    });

    if (!filtered.length) {
      listContainerEl.innerHTML = '<div class="text-center py-8 text-slate-500 text-xs bg-slate-950 rounded-xl border border-slate-800">لا توجد أصناف مطابقة للبحث 🔍</div>';
      return;
    }

    listContainerEl.innerHTML = filtered.map(p => {
      const pid = String(p.id);
      const oldPrice = Math.round(Number(p.p) || 0);
      const pendingVal = mobilePendingPrices[pid];
      const isModified = pendingVal !== undefined && pendingVal > 0 && pendingVal !== oldPrice;
      const inputVal = pendingVal !== undefined ? pendingVal : oldPrice;
      const diff = isModified ? (pendingVal - oldPrice) : 0;

      return `
        <div id="mq-row-${pid}" class="flex items-center justify-between gap-2 ${isModified ? 'bg-emerald-950/35 border-emerald-500/50' : 'bg-slate-950 border-slate-800'} border p-2 rounded-xl text-xs transition">
          <div class="min-w-0 flex-1">
            <p class="font-bold text-white truncate">${p.name}</p>
            <p id="mq-diff-${pid}" class="${isModified ? (diff > 0 ? 'text-[10px] font-bold text-amber-400' : 'text-[10px] font-bold text-emerald-400') : 'text-[10px] text-slate-500'}">
              ${isModified ? `${oldPrice} ← (${diff > 0 ? '+' : ''}${diff})` : `الحالي: ${oldPrice} ج.م`}
            </p>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <input
              type="number"
              inputmode="numeric"
              pattern="[0-9]*"
              data-pid="${pid}"
              value="${inputVal}"
              class="mq-price-input w-20 bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-lg py-1.5 px-2 text-center font-black text-amber-300 text-xs focus:outline-none"
            >
            <span class="text-[10px] text-slate-400">ج.م</span>
          </div>
        </div>
      `;
    }).join('');

    listContainerEl.querySelectorAll('.mq-price-input').forEach(inp => {
      inp.addEventListener('focus', function() { this.select(); });
      inp.addEventListener('input', function() {
        handlePriceInput(this.getAttribute('data-pid'), this.value);
      });
    });
  }

  async function saveChanges() {
    const modified = getModifiedEntries();
    if (!modified.length) {
      alert('لم تقم بتغيير أي سعر بعد. عدّل سعراً واحداً على الأقل أولاً.');
      return;
    }

    const updatedProds = [];
    modified.forEach(item => {
      const prod = products.find(p => String(p.id) === String(item.id));
      if (prod) {
        prod.p = item.newPrice;
        updatedProds.push(prod);
      }
    });

    mobilePendingPrices = {};
    try {
      localStorage.setItem('sp_p', JSON.stringify(products));
    } catch (e) {}

    if (db && updatedProds.length > 0) {
      try {
        setSyncBadge('جاري الحفظ...', 'warn');
        const batch = db.batch();
        updatedProds.forEach(p => {
          const ref = db.collection('products').doc(String(p.id));
          batch.set(ref, { p: p.p }, { merge: true });
        });
        await batch.commit();
        setSyncBadge('تمت المزامنة ✅', 'ok');
      } catch (err) {
        console.error('Firestore save error:', err);
        setSyncBadge('محلي فقط ⚠️', 'warn');
      }
    }

    renderList();
    updateModifiedBadge();
    alert(`✅ تم حفظ (${modified.length}) تعديل بنجاح!`);
  }

  function buildWhatsappMessage() {
    const modified = getModifiedEntries();
    if (!modified.length) return '';
    const lines = modified.map(m => `${m.name} ${m.newPrice}`);
    return `📋 *تحديث أسعار - Smoke Shop*\n` + lines.join('\n');
  }

  function copyChanges() {
    const msg = buildWhatsappMessage();
    if (!msg) {
      alert('لا توجد تعديلات حالية لنسخها! عدّل سعراً واحداً على الأقل أولاً.');
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(
        () => alert('تم نسخ التعديلات بنجاح! 📋'),
        () => prompt('انسخ النص التالي:', msg)
      );
    } else {
      prompt('انسخ النص التالي:', msg);
    }
  }

  function sendWhatsapp() {
    const msg = buildWhatsappMessage();
    if (!msg) {
      alert('لا توجد تعديلات حالية لإرسالها! عدّل سعراً واحداً على الأقل أولاً.');
      return;
    }
    let dest = (shopPhone || '01221143854').replace(/\D/g, '');
    if (dest.startsWith('01')) dest = '2' + dest;
    window.open(`https://wa.me/${dest}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  async function loadCloudData() {
    if (!db) return;
    try {
      const snap = await db.collection('products').get();
      if (snap.empty) return;

      const cloudProds = [];
      snap.forEach(doc => {
        if (doc.id === '_categories_config_') {
          const d = doc.data();
          if (d && Array.isArray(d.list) && d.list.length > 0) {
            categories = d.list;
            try { localStorage.setItem('sp_cats', JSON.stringify(categories)); } catch (e) {}
          }
        } else if (!doc.id.startsWith('_')) {
          const data = doc.data();
          if (data && data.name && data.p !== undefined) {
            cloudProds.push({ id: doc.id, ...data });
          }
        }
      });

      if (cloudProds.length > 0) {
        cloudProds.sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));
        products = cloudProds;
        try { localStorage.setItem('sp_p', JSON.stringify(products)); } catch (e) {}
      }

      populateCategories();
      renderList();
      updateModifiedBadge();
      setSyncBadge('متصل بالسحابة ✅', 'ok');
    } catch (err) {
      console.warn('Cloud load notice:', err);
    }
  }

  if (catSelectEl) catSelectEl.addEventListener('change', renderList);
  if (searchInputEl) searchInputEl.addEventListener('input', renderList);

  document.getElementById('saveCloudBtn')?.addEventListener('click', saveChanges);
  document.getElementById('copyChangesBtn')?.addEventListener('click', copyChanges);
  document.getElementById('sendWhatsappBtn')?.addEventListener('click', sendWhatsapp);

  document.getElementById('resetEditsBtn')?.addEventListener('click', function() {
    mobilePendingPrices = {};
    renderList();
    updateModifiedBadge();
  });

  document.getElementById('editPhoneBtn')?.addEventListener('click', function() {
    const nextPh = prompt('أدخل رقم واتساب الإدارة:', shopPhone);
    if (nextPh && nextPh.trim()) {
      shopPhone = nextPh.trim();
      try { localStorage.setItem('sp_ph', shopPhone); } catch (e) {}
      updatePhoneUI();
    }
  });

  updatePhoneUI();
  populateCategories();
  renderList();
  updateModifiedBadge();
  loadCloudData();
})();
</script>
</body>
</html>
