<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعديل الأسعار السريع - Smoke Shop</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
  body { margin: 0; padding: 0 0 95px 0; background: #090d16; color: #f8fafc; }
  header { position: sticky; top: 0; z-index: 30; background: #111827; border-bottom: 1px solid #1f2937; padding: 12px 16px; }
  .header-inner { max-width: 520px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand h1 { margin: 0; font-size: 15px; color: #fbbf24; }
  .brand p { margin: 2px 0 0; font-size: 11px; color: #94a3b8; }
  .badge { font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 999px; background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); white-space: nowrap; }
  main { max-width: 520px; margin: 14px auto 0; padding: 0 12px; }
  .card { background: #111827; border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 16px; padding: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .card-top h2 { margin: 0; font-size: 15px; color: #fbbf24; }
  .card-top p { margin: 4px 0 0; font-size: 11px; color: #94a3b8; line-height: 1.5; }
  .mod-badge { font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 999px; background: #1e293b; color: #94a3b8; white-space: nowrap; }
  .mod-badge.active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.45); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  select, input[type="text"] { width: 100%; background: #090d16; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; padding: 9px 10px; font-size: 12px; outline: none; }
  select:focus, input[type="text"]:focus, input[type="number"]:focus { border-color: #f59e0b; }
  .list { display: flex; flex-direction: column; gap: 7px; max-height: 58vh; overflow-y: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 10px; }
  .row.modified { background: rgba(6, 78, 59, 0.35); border-color: rgba(16, 185, 129, 0.55); }
  .item-info { min-width: 0; flex: 1; }
  .item-name { margin: 0; font-size: 13px; font-weight: bold; color: #ffffff; }
  .item-sub { margin: 3px 0 0; font-size: 11px; color: #64748b; }
  .item-sub.up { color: #fbbf24; font-weight: bold; }
  .item-sub.down { color: #34d399; font-weight: bold; }
  .price-box { display: flex; align-items: center; gap: 6px; }
  .price-input { width: 82px; background: #111827; color: #fcd34d; border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; font-size: 13px; font-weight: bold; text-align: center; outline: none; }
  .currency { font-size: 11px; color: #94a3b8; }
  .footer-bar { margin-top: 12px; padding-top: 8px; border-top: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; }
  .link-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px 0; font-size: 11px; }
  .link-btn:hover { color: #fbbf24; }
  .link-btn.reset:hover { color: #f87171; }
  .bottom-actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #111827; border-top: 1px solid #1f2937; padding: 10px 12px; }
  .bottom-inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-copy { background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; padding: 11px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-wa { background: #059669; color: #ffffff; border: none; border-radius: 12px; padding: 11px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-wa:hover { background: #10b981; }
  .empty { text-align: center; padding: 28px 12px; color: #64748b; font-size: 12px; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">🏷️</div>
      <div>
        <h1>SMOKE SHOP</h1>
        <p>تطبيق تعديل الأسعار السريع</p>
      </div>
    </div>
    <span id="itemsCountBadge" class="badge">جاهز</span>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-top">
      <div>
        <h2>📱 التعديل السريع للأسعار</h2>
        <p>اختر القسم أو ابحث بالاسم، وعدّل السعر مباشرة، ثم أرسل التعديلات على واتساب.</p>
      </div>
      <span id="mobileModifiedBadge" class="mod-badge">0 معدّل</span>
    </div>

    <div class="filters">
      <select id="mobileQuickCatSelect">
        <option value="all">كل الأقسام</option>
      </select>
      <input type="text" id="mobileQuickSearch" placeholder="بحث باسم الصنف...">
    </div>

    <div id="mobileQuickPriceList" class="list"></div>

    <div class="footer-bar">
      <button type="button" id="phoneBtn" class="link-btn">
        ⚙️ واتساب الإدارة: <strong id="targetPhonePreview" style="color:#fcd34d;">01221143854</strong>
      </button>
      <button type="button" id="resetBtn" class="link-btn reset">
        ↺ تراجع عن التعديلات
      </button>
    </div>
  </section>
</main>

<div class="bottom-actions">
  <div class="bottom-inner">
    <button type="button" id="copyBtn" class="btn-copy">📋 نسخ التعديلات</button>
    <button type="button" id="waBtn" class="btn-wa">📲 إرسال التعديلات واتس</button>
  </div>
</div>

<script>
(function () {
  var CATEGORIES = [
    { id: "all", n: "كل الأقسام" },
    { id: "local", n: "سجائر محلي" },
    { id: "for", n: "سجائر أجنبي" },
    { id: "oth", n: "متنوع وبحري" },
    { id: "acc", n: "ولاعات وبفرة" },
    { id: "mol", n: "تبغ وتوباكو" }
  ];

  var PRODUCTS = [
    { id: 1, name: "كيلوباترا", c: "local", p: 485 },
    { id: 2, name: "بوكس", c: "local", p: 485 },
    { id: 3, name: "سوبر", c: "local", p: 495 },
    { id: 4, name: "ال ام احمر", c: "for", p: 825 },
    { id: 5, name: "ال ام ازرق", c: "for", p: 825 },
    { id: 6, name: "ال ام ابيض", c: "for", p: 810 },
    { id: 7, name: "مارلبورو", c: "for", p: 1020 },
    { id: 8, name: "ميريت", c: "for", p: 1115 },
    { id: 9, name: "مارلبورو كرافتد", c: "for", p: 785 },
    { id: 10, name: "ونستون", c: "for", p: 705 },
    { id: 11, name: "تارجت شركه", c: "for", p: 485 },
    { id: 12, name: "تايم شركه", c: "for", p: 570 },
    { id: 13, name: "دوف ايفولف", c: "for", p: 610 },
    { id: 14, name: "جولد كوست", c: "oth", p: 480 },
    { id: 15, name: "دوف", c: "for", p: 1020 },
    { id: 16, name: "كنتاكى", c: "oth", p: 220 },
    { id: 17, name: "ال ان", c: "oth", p: 220 },
    { id: 18, name: "ريد قديم", c: "oth", p: 375 },
    { id: 19, name: "ريد جديد", c: "oth", p: 315 },
    { id: 20, name: "كاريلا احمر", c: "oth", p: 370 },
    { id: 21, name: "كاريلا ازرق", c: "oth", p: 370 },
    { id: 22, name: "كابتن سكاى", c: "oth", p: 250 },
    { id: 23, name: "بن ازرق", c: "oth", p: 250 },
    { id: 24, name: "تايم بحرى", c: "oth", p: 305 },
    { id: 25, name: "تايم جديد", c: "oth", p: 235 },
    { id: 26, name: "تارجت بحر", c: "oth", p: 255 },
    { id: 27, name: "كابتن زيرو فايف", c: "oth", p: 285 },
    { id: 28, name: "كابتن جولد سليم", c: "oth", p: 290 },
    { id: 29, name: "كابتن كومباكت جولد", c: "oth", p: 330 },
    { id: 30, name: "اتش بى", c: "oth", p: 255 },
    { id: 31, name: "ولاعه عاده", c: "acc", p: 200 },
    { id: 32, name: "ولاعه سخان", c: "acc", p: 250 },
    { id: 33, name: "بفره جاهزه", c: "acc", p: 235 },
    { id: 34, name: "سلوووم", c: "mol", p: 2400 },
    { id: 35, name: "دفراوى ١٠", c: "mol", p: 1400 },
    { id: 36, name: "دفراوى ٢0", c: "mol", p: 2200 },
    { id: 37, name: "برج ٣0", c: "mol", p: 700 },
    { id: 38, name: "برج ٤0", c: "mol", p: 750 },
    { id: 39, name: "برج ٥0", c: "mol", p: 950 }
  ];

  var adminPhone = "01221143854";
  var pendingPrices = {};

  var catSelect = document.getElementById("mobileQuickCatSelect");
  var searchInput = document.getElementById("mobileQuickSearch");
  var listContainer = document.getElementById("mobileQuickPriceList");
  var modBadge = document.getElementById("mobileModifiedBadge");
  var phonePreview = document.getElementById("targetPhonePreview");
  var itemsBadge = document.getElementById("itemsCountBadge");

  try {
    var savedPhone = localStorage.getItem("sp_price_editor_phone");
    if (savedPhone) adminPhone = savedPhone;
  } catch (e) {}

  phonePreview.textContent = adminPhone;
  itemsBadge.textContent = PRODUCTS.length + " صنف";

  function buildCategoryOptions() {
    var html = "";
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      var count = cat.id === "all" ? PRODUCTS.length : PRODUCTS.filter(function (p) { return p.c === cat.id; }).length;
      html += '<option value="' + cat.id + '">' + cat.n + " (" + count + ")</option>";
    }
    catSelect.innerHTML = html;
  }

  function getModifiedList() {
    var result = [];
    for (var i = 0; i < PRODUCTS.length; i++) {
      var prod = PRODUCTS[i];
      var key = String(prod.id);
      if (pendingPrices[key] !== undefined) {
        var oldP = Number(prod.p);
        var newP = Number(pendingPrices[key]);
        if (!isNaN(newP) && newP > 0 && newP !== oldP) {
          result.push({ id: prod.id, name: prod.name, oldPrice: oldP, newPrice: newP, diff: newP - oldP });
        }
      }
    }
    return result;
  }

  function updateBadge() {
    var count = getModifiedList().length;
    modBadge.textContent = count + " معدّل";
    modBadge.className = count > 0 ? "mod-badge active" : "mod-badge";
  }

  function handlePriceChange(prodId, rawVal) {
    var key = String(prodId);
    var prod = PRODUCTS.find(function (p) { return String(p.id) === key; });
    if (!prod) return;

    var cleaned = String(rawVal || "").trim();
    var oldP = Number(prod.p);
    var num = parseInt(cleaned, 10);

    if (cleaned === "" || isNaN(num) || num === oldP) {
      delete pendingPrices[key];
    } else {
      pendingPrices[key] = num;
    }

    var rowEl = document.getElementById("row-" + key);
    var subEl = document.getElementById("sub-" + key);
    var isMod = pendingPrices[key] !== undefined && pendingPrices[key] > 0;

    if (rowEl) rowEl.className = isMod ? "row modified" : "row";
    if (subEl) {
      if (isMod) {
        var diff = pendingPrices[key] - oldP;
        subEl.textContent = oldP + " ← (" + (diff > 0 ? "+" : "") + diff + ")";
        subEl.className = diff > 0 ? "item-sub up" : "item-sub down";
      } else {
        subEl.textContent = "الحالي: " + oldP + " ج.م";
        subEl.className = "item-sub";
      }
    }
    updateBadge();
  }

  function renderList() {
    var selectedCat = catSelect.value || "all";
    var query = String(searchInput.value || "").trim().toLowerCase();

    var rowsHtml = "";
    for (var i = 0; i < PRODUCTS.length; i++) {
      var p = PRODUCTS[i];
      var matchCat = (selectedCat === "all" || p.c === selectedCat);
      var matchQuery = (!query || p.name.toLowerCase().indexOf(query) !== -1);
      if (!matchCat || !matchQuery) continue;

      var key = String(p.id);
      var oldP = Number(p.p);
      var hasPending = pendingPrices[key] !== undefined && pendingPrices[key] > 0;
      var shownVal = hasPending ? pendingPrices[key] : oldP;
      var diff = hasPending ? (pendingPrices[key] - oldP) : 0;

      var subClass = hasPending ? (diff > 0 ? "item-sub up" : "item-sub down") : "item-sub";
      var subText = hasPending ? (oldP + " ← (" + (diff > 0 ? "+" : "") + diff + ")") : ("الحالي: " + oldP + " ج.م");

      rowsHtml +=
        '<div id="row-' + key + '" class="' + (hasPending ? "row modified" : "row") + '">' +
          '<div class="item-info">' +
            '<p class="item-name">' + p.name + '</p>' +
            '<p id="sub-' + key + '" class="' + subClass + '">' + subText + '</p>' +
          '</div>' +
          '<div class="price-box">' +
            '<input type="number" class="price-input" data-id="' + key + '" value="' + shownVal + '">' +
            '<span class="currency">ج.م</span>' +
          '</div>' +
        '</div>';
    }

    if (!rowsHtml) {
      listContainer.innerHTML = '<div class="empty">لا توجد أصناف مطابقة للبحث</div>';
      return;
    }

    listContainer.innerHTML = rowsHtml;

    var inputs = listContainer.querySelectorAll(".price-input");
    for (var k = 0; k < inputs.length; k++) {
      inputs[k].addEventListener("input", function () {
        handlePriceChange(this.getAttribute("data-id"), this.value);
      });
      inputs[k].addEventListener("focus", function () {
        this.select();
      });
    }
  }

  function buildMessage() {
    var mods = getModifiedList();
    if (!mods.length) return "";
    var lines = ["📋 *تحديث أسعار - Smoke Shop*"];
    for (var i = 0; i < mods.length; i++) {
      lines.push(mods[i].name + " " + mods[i].newPrice);
    }
    return lines.join("\n");
  }

  document.getElementById("waBtn").addEventListener("click", function () {
    var msg = buildMessage();
    if (!msg) { alert("عدّل سعراً واحداً على الأقل أولاً."); return; }
    var digits = String(adminPhone || "01221143854").replace(/\D/g, "");
    if (digits.indexOf("01") === 0) digits = "2" + digits;
    window.open("https://wa.me/" + digits + "?text=" + encodeURIComponent(msg), "_blank");
  });

  document.getElementById("copyBtn").addEventListener("click", function () {
    var msg = buildMessage();
    if (!msg) { alert("عدّل سعراً واحداً على الأقل أولاً."); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(function () { alert("تم نسخ التعديلات."); }, function () { prompt("انسخ النص التالي:", msg); });
    } else {
      prompt("انسخ النص التالي:", msg);
    }
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    pendingPrices = {};
    renderList();
    updateBadge();
  });

  document.getElementById("phoneBtn").addEventListener("click", function () {
    var nextPhone = prompt("أدخل رقم واتساب الإدارة:", adminPhone);
    if (nextPhone && nextPhone.trim()) {
      adminPhone = nextPhone.trim();
      phonePreview.textContent = adminPhone;
      try { localStorage.setItem("sp_price_editor_phone", adminPhone); } catch (e) {}
    }
  });

  catSelect.addEventListener("change", renderList);
  searchInput.addEventListener("input", renderList);

  buildCategoryOptions();
  renderList();
  updateBadge();
})();
</script>
</body>
</html>
